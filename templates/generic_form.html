{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="hf-form-card">
    <div class="hf-page-header"><h1>{{ heading }}</h1>{% if subtitle %}<p class="text-muted mb-0">{{ subtitle }}</p>{% endif %}</div>
    <div class="hf-card"><div class="hf-card-body">
      <form method="post" novalidate {% if multipart %}enctype="multipart/form-data"{% endif %}>
        {% csrf_token %}
        {% include "partials/form_fields.html" %}
        <div class="d-flex gap-2 mt-2">
          <button type="submit" class="btn btn-primary">{{ submit_label|default:"Save" }}</button>
          <a class="btn btn-outline-secondary" href="{% if cancel_args %}{% url cancel_url cancel_args.0 %}{% else %}{% url cancel_url %}{% endif %}">Cancel</a>
        </div>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
