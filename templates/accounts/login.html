{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="container py-5"><div class="hf-auth-card">
  <div class="hf-card"><div class="hf-card-body p-4">
    <h1 class="h4 mb-1">Welcome back</h1>
    <p class="text-muted">Log in to continue to HireFlow.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      {% include "partials/form_fields.html" %}
      <button type="submit" class="btn btn-primary w-100" data-loading-text="Logging in...">Log in</button>
    </form>
    <div class="d-flex justify-content-between mt-3 small">
      <a href="{% url 'accounts:password_reset' %}">Forgot password?</a>
      <span>New here? <a href="{% url 'accounts:register_candidate' %}">Sign up</a></span>
    </div>
  </div></div>
</div></div>
{% endblock %}
