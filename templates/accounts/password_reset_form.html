{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="container py-5"><div class="hf-auth-card"><div class="hf-card"><div class="hf-card-body p-4">
  <h1 class="h4">Forgot your password?</h1>
  <p class="text-muted">Enter your email address and we will send you a reset link.</p>
  <form method="post" novalidate>{% csrf_token %}{% include "partials/form_fields.html" %}
    <button type="submit" class="btn btn-primary w-100" data-loading-text="Sending...">Send reset link</button></form>
</div></div></div></div>
{% endblock %}
